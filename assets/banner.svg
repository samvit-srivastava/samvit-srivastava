<svg width="900" height="350" viewBox="0 0 900 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="o1" cx="15%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.30"><animate attributeName="stop-opacity" values="0.30;0.50;0.30" dur="3.5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"><animate attributeName="stop-opacity" values="0.28;0.48;0.28" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o3" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"><animate attributeName="stop-opacity" values="0.22;0.38;0.22" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o4" cx="35%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"><animate attributeName="stop-opacity" values="0.16;0.30;0.16" dur="4.5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o5" cx="70%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"><animate attributeName="stop-opacity" values="0.14;0.26;0.14" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/><stop offset="12%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="1"/><stop offset="88%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/><stop offset="30%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.3"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="0" y1="0" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/><stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.3"/><stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/><stop offset="20%" stop-color="#FFFFFF"/><stop offset="80%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0L40 20L20 40L0 20Z" fill="none" stroke="#fff" stroke-width="0.4"/>
    </pattern>
    <pattern id="scanlines" width="900" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1.5" x2="900" y2="1.5" stroke="#fff" stroke-width="0.3"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="tg"><feGaussianBlur stdDeviation="2" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
    <filter id="sg"><feGaussianBlur stdDeviation="4" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>

  <!-- Base -->
  <rect width="900" height="350" fill="#010409"/>

  <!-- Orbs -->
  <rect width="900" height="350" fill="url(#o1)"/>
  <rect width="900" height="350" fill="url(#o2)"/>
  <rect width="900" height="350" fill="url(#o3)"/>
  <rect width="900" height="350" fill="url(#o4)"/>
  <rect width="900" height="350" fill="url(#o5)"/>

  <!-- Diamond grid -->
  <rect width="900" height="350" fill="url(#diamonds)" opacity="0.025"/>

  <!-- Horizontal scanlines -->
  <rect width="900" height="350" fill="url(#scanlines)" opacity="0.02"/>

  <!-- Sweeping scan line -->
  <rect x="0" y="0" width="900" height="1.5" fill="#00F2FE" opacity="0.06">
    <animate attributeName="y" values="-2;352" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left edge glow -->
  <rect x="0" y="0" width="1.5" height="350" fill="url(#edgeL)" opacity="0.8"/>
  <!-- Right edge glow -->
  <rect x="898.5" y="0" width="1.5" height="350" fill="url(#edgeR)" opacity="0.8"/>
  <!-- Top edge -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#accent)" opacity="0.5"/>
  <!-- Bottom edge -->
  <rect x="0" y="348.5" width="900" height="1.5" fill="url(#accent)" opacity="0.7"/>

  <!-- Corner brackets -->
  <path d="M 22 14L14 14L14 22" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.7" filter="url(#sg)"/>
  <path d="M 878 14L886 14L886 22" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7" filter="url(#sg)"/>
  <path d="M 22 336L14 336L14 328" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7" filter="url(#sg)"/>
  <path d="M 878 336L886 336L886 328" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.7" filter="url(#sg)"/>

  <!-- Circuit lines (bottom-left) -->
  <polyline points="30,310 80,310 95,295 140,295" stroke="#00F2FE" stroke-width="0.6" fill="none" opacity="0.12"/>
  <circle cx="140" cy="295" r="2" fill="#00F2FE" opacity="0.2"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <polyline points="30,325 60,325 75,315" stroke="#8B5CF6" stroke-width="0.5" fill="none" opacity="0.08"/>

  <!-- Circuit lines (top-right) -->
  <polyline points="870,40 820,40 805,55 760,55" stroke="#8B5CF6" stroke-width="0.6" fill="none" opacity="0.12"/>
  <circle cx="760" cy="55" r="2" fill="#8B5CF6" opacity="0.2"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  <polyline points="870,25 840,25 825,35" stroke="#00F2FE" stroke-width="0.5" fill="none" opacity="0.08"/>

  <!-- Data rain (left) -->
  <circle cx="25" cy="0" r="1" fill="#00F2FE" opacity="0.12"><animate attributeName="cy" values="-10;360" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="25" cy="0" r="1" fill="#00F2FE" opacity="0.08"><animate attributeName="cy" values="-10;360" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="45" cy="0" r="0.8" fill="#8B5CF6" opacity="0.10"><animate attributeName="cy" values="-10;360" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="45" cy="0" r="0.8" fill="#8B5CF6" opacity="0.06"><animate attributeName="cy" values="-10;360" dur="4s" begin="2.5s" repeatCount="indefinite"/></circle>

  <!-- Data rain (right) -->
  <circle cx="875" cy="0" r="1" fill="#8B5CF6" opacity="0.12"><animate attributeName="cy" values="-10;360" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="875" cy="0" r="1" fill="#8B5CF6" opacity="0.07"><animate attributeName="cy" values="-10;360" dur="3.5s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="855" cy="0" r="0.8" fill="#00F2FE" opacity="0.09"><animate attributeName="cy" values="-10;360" dur="4.5s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="855" cy="0" r="0.8" fill="#00F2FE" opacity="0.06"><animate attributeName="cy" values="-10;360" dur="4.5s" begin="3s" repeatCount="indefinite"/></circle>

  <!-- Floating particles -->
  <circle cx="820" cy="45" r="1.5" fill="#00F2FE" opacity="0.3"><animate attributeName="opacity" values="0.3;0.06;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="845" cy="80" r="1" fill="#8B5CF6" opacity="0.22"><animate attributeName="opacity" values="0.22;0.04;0.22" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="92" r="1.3" fill="#3B82F6" opacity="0.18"><animate attributeName="opacity" values="0.18;0.04;0.18" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="55" r="1" fill="#3B82F6" opacity="0.15"><animate attributeName="opacity" values="0.15;0.03;0.15" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="65" cy="280" r="1.2" fill="#8B5CF6" opacity="0.18"><animate attributeName="opacity" values="0.18;0.03;0.18" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="305" r="1.5" fill="#00F2FE" opacity="0.14"><animate attributeName="opacity" values="0.14;0.03;0.14" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="290" r="1" fill="#6366F1" opacity="0.16"><animate attributeName="opacity" values="0.16;0.03;0.16" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="310" r="0.8" fill="#00F2FE" opacity="0.12"><animate attributeName="opacity" values="0.12;0.02;0.12" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="45" r="0.8" fill="#6366F1" opacity="0.10"><animate attributeName="opacity" values="0.10;0.02;0.10" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="35" r="1" fill="#00F2FE" opacity="0.13"><animate attributeName="opacity" values="0.13;0.03;0.13" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="315" r="1" fill="#3B82F6" opacity="0.10"><animate attributeName="opacity" values="0.10;0.02;0.10" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="300" r="1.2" fill="#8B5CF6" opacity="0.11"><animate attributeName="opacity" values="0.11;0.02;0.11" dur="4.8s" repeatCount="indefinite"/></circle>

  <!-- Status dot -->
  <circle cx="36" cy="30" r="3.5" fill="#00F2FE" opacity="0.9" filter="url(#sg)">
    <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="34" font-family="'Fira Code','Courier New',monospace" font-size="9" fill="#00F2FE" opacity="0.4" letter-spacing="1.5">SYS.ONLINE</text>

  <!-- Name -->
  <text x="450" y="130" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5" filter="url(#tg)">Samvit Srivastava</text>

  <!-- Role pill -->
  <rect x="305" y="148" width="290" height="32" rx="16" fill="#0D1117" fill-opacity="0.8" stroke="#1C2333" stroke-width="1"/>
  <text x="450" y="169" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="11" font-weight="600" fill="#8B949E" letter-spacing="3">COMPUTER SCIENCE STUDENT</text>

  <!-- Accent line -->
  <rect x="160" y="202" width="580" height="2.5" rx="1.25" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="450" y="245" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" fill="#6E7681">Building practical software through</text>

  <!-- Three pillars -->
  <text x="270" y="282" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#00F2FE" opacity="0.9" filter="url(#tg)">AI</text>
  <circle cx="332" cy="278" r="1.5" fill="#21262D"/>
  <text x="450" y="282" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#3B82F6" opacity="0.9" filter="url(#tg)">OPEN SOURCE</text>
  <circle cx="568" cy="278" r="1.5" fill="#21262D"/>
  <text x="645" y="282" text-anchor="middle" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#8B5CF6" opacity="0.9" filter="url(#tg)">HACKATHONS</text>

  <!-- Right orbital -->
  <g transform="translate(830,175)">
    <circle cx="0" cy="0" r="65" stroke="#00F2FE" stroke-width="0.7" stroke-dasharray="3 5" opacity="0.18"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="42" stroke="#8B5CF6" stroke-width="0.7" stroke-dasharray="6 4" opacity="0.15"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="22" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="3" fill="#3B82F6" opacity="0.5" filter="url(#sg)"/>
  </g>

  <!-- Left orbital -->
  <g transform="translate(70,175)">
    <circle cx="0" cy="0" r="50" stroke="#8B5CF6" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.14"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="30" stroke="#00F2FE" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="2.5" fill="#8B5CF6" opacity="0.4" filter="url(#sg)"/>
  </g>
</svg>
